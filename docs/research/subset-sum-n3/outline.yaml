# Research outline: worst-case exact subset sum toward O*(2^(n/3)).
# Generated by the /research workflow on 2026-10-03.
topic: "Worst-case algorithms for exact subset sum toward O*(2^(n/3))"
current_date: "2026-10-03"

items:
  - name: meet_in_the_middle
    category: algorithmic-family
    description: >-
      Horowitz-Sahni sorted meet-in-the-middle (O*(2^(n/2)) time/space) and the
      Schroeppel-Shamir time/space tradeoff (O*(2^(n/2)) time, O*(2^(n/4))
      space). The baseline every proposed improvement must beat.
  - name: representation_technique
    category: average-case-technique
    description: >-
      Howgrave-Graham-Joux and Becker-Coron-Joux dissection/representation
      technique for hard (random, density ~1) knapsacks; achieves ~2^(0.291n)
      by counting many representations but is not worst-case.
  - name: worst_case_representation_mixing
    category: worst-case-technique
    description: >-
      Randolph-Wegrzycki worst-case representation: mixing, flexible
      representations, and pseudosolution recovery. Breaks the MITM barrier in
      the worst case for most constant coefficient sets but not for {0,1} subset
      sum or Partition.
  - name: schroeppel_shamir_orthogonal_vectors
    category: technique
    description: >-
      Nederlof-Wegrzycki reduction of worst-case subset sum to Orthogonal
      Vectors, yielding O*(2^(0.5n)) time with O*(2^(0.249999n)) space and a
      tight link between improvements to either problem.
  - name: space_efficient_subset_sum
    category: space-complexity
    description: >-
      Improved space bounds and explicit time-space tradeoffs: Belova et al.
      (ESA 2024) reduce space to O*(2^(0.246n)); polynomial-space algorithms
      with exponential time. Space is a first-class axis toward 2^(n/3).
  - name: structured_3sum_4sum
    category: fine-grained
    description: >-
      Structured 3SUM/4SUM over subset-sum sets and bounded-integer
      convolution. A three-block split reduces the problem to a structured
      k-sum over 2^(n/3)-sized sets; the question is whether subquadratic
      structure exploits it.
  - name: additive_combinatorics_density
    category: additive-combinatorics
    description: >-
      Density dichotomy via additive energy, sumset size, and Kneser's theorem;
      constructive dense subset sum (Chen-Mao-Zhang, STOC 2025) gives O~(n)-time
      search for dense instances and progressive structure.
  - name: bit_packing_word_ram
    category: word-ram-technique
    description: >-
      Baran-Demaine-Patrascu bit-packing and word-/circuit-RAM techniques used
      by Chen et al. (RANDOM 2023) to shave a polynomial factor off the
      worst-case 2^(n/2) bound.
  - name: algebraization_inclusion_exclusion
    category: algebraic
    description: >-
      Lokshtanov-Nederlof "saving space by algebraization", inclusion-exclusion,
      and generating-function/convolution methods; pseudopolynomial time in
      polynomial space and algebraic computation of subset-sum coefficients.
  - name: generalized_birthday_wagner
    category: modular-combinatorics
    description: >-
      Wagner's generalized birthday algorithm and modular linear algebra over
      Z_m as a way to solve constrained subset-sum-like equations with many
      variables; the source of the 2^(n/(log n)) style bounds.
  - name: lattice_reduction_bkz
    category: cryptanalytic
    description: >-
      Lattice reduction (LLL, BKZ, Lagarias-Odlyzko) for low-density subset sum
      and hard knapsacks; largely average-case/heuristic and a source of
      conditional hardness for the general problem.
  - name: average_case_modular_cryptanalysis
    category: cryptanalytic
    description: >-
      Average-case modular/representation cryptanalysis: Joux-Wegrzycki (STACS
      2026) improve Lagarias-Odlyzko via modular arithmetic; density thresholds
      and ternary representations define the cryptanalytic frontier.
  - name: quantum_subset_sum_ksum
    category: quantum
    description: >-
      Quantum algorithms for subset sum and k-SUM: Bernstein-Jeffery-Lange-Meurer
      O*(2^(n/3)) and recent worst-case quantum k-SUM (Chukhin et al. 2026)
      giving O*(2^(2n/7)) via a 7-sum block reduction.
  - name: parameterized_pseudopolynomial_proximity
    category: pseudopolynomial
    description: >-
      Pseudopolynomial-regime breakthroughs and proximity: Bringmann-Fischer-Nakos
      beating Bellman (SODA 2025), deterministic subset sum (Chan, SODA 2026),
      and how they constrain what a 2^(n/3) algorithm must beat.
  - name: nfold_hyperplane_ilp
    category: ilp-equivalence
    description: >-
      N-fold/hyperplane-constrained ILP equivalence and proximity (Randolph-Wegrzycki
      ESA 2024; Eisenbrand-Weismantel Steinitz-lemma proximity), connecting
      exponential subset sum to integer-programming structure.
  - name: lower_bounds_barriers
    category: barrier
    description: >-
      Conditional lower bounds and barriers: ETH, SETH, 3SUM, (min,+)-convolution,
      the k-SUM conjecture, and the formal Meet-in-the-Middle conjecture. Defines
      what a 2^(n/3) algorithm would and would not contradict.
  - name: either_or_subset_sum
    category: problem-variant
    description: >-
      Randolph's "Either-Or" subset sum: a 1-bit variant solved in the worst case
      in O(2^((0.5-eps)n)) with eps>0.03 via random restrictions, offered as an
      explicit benchmark for the formal MITM conjecture.
  - name: equal_subset_sum_pess
    category: problem-variant
    description: >-
      Equal-Subset-Sum and Pigeonhole Equal Subset Sum, where the 2^(n/3) target
      is already attained (Zhang 2024) and refined (Jin-Wu ICALP 2024;
      Jin-Williams-Zhang ESA 2025) with a lattice-based conditional lower bound.
  - name: cardinality_constrained_subset_sum
    category: problem-variant
    description: >-
      Cardinality-constrained / fixed-weight subset sum: search restricted to one
      Hamming layer; structurally distinct and relevant to the mixing step and
      bounded-coefficient balancing.
  - name: practical_hybrids_pruning
    category: practical
    description: >-
      Practical hybrids: branch-and-bound, Horowitz-Sahni variants, SAT/ILP
      encodings, and empirical speedups, including which structural features
      make real instances easy.

execution:
  batch_size: 4
  items_per_agent: 2
  output_dir: docs/research/subset-sum-n3/results
