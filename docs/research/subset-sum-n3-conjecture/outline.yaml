# Research outline: approaches to the open collision-counting / distinct-sums conjectures.
# Generated by the /research workflow on 2026-10-06.
# Context: docs/research/subset-sum-n3/{LIFT.md,HIGH_ENERGY.md} and docs/reports/lift/lift.tex.
# Conjectures: (C1) for every {0,1} instance the number N_c of equal-sum disjoint pairs of
# Theta(n)-subsets among all n inputs is 2^{o(n)}, or the input is in the large-bin (AKKN) regime
# that combines to 2^{(1/2-eps)n}; (C2) a hard instance cannot have every solution's support with
# few distinct balanced half-sums D* <= 2^{0.311n}.
# Items marked "recall-based" were suggested from model memory, not searched; deep research must
# verify them against the primary source before anything is cited.
topic: "Approaches to the collision-counting and distinct-sums conjectures for worst-case {0,1} subset sum"
current_date: "2026-10-06"
time_range: "since 2023 (classical additive combinatorics included as primary sources)"

items:
  - name: akkn_density_dichotomy
    category: algorithmic-dichotomy
    description: >-
      Austrin-Kaski-Koivisto-Nederlof (STACS 2016, arXiv 1508.06019): parameterize by the
      maximum bin size beta (most subsets sharing one sum); instances with beta <= 2^{(0.5-eps)n}
      or beta >= 2^{0.661n} are solvable below 2^{n/2}. The large-bin branch of C1.
  - name: small_doubling_constructive_freiman
    category: additive-combinatorics-algorithmic
    description: >-
      Randolph-Wegrzycki (arXiv 2407.18228): subset sum in n^{O_C(1)} for doubling constant
      C = |A+A|/|A|, via an efficiently constructive Freiman theorem. Applies at constant C only;
      our regime has polynomial doubling.
  - name: worst_case_representation_rw
    category: worst-case-technique
    description: >-
      Randolph-Wegrzycki worst-case representation (arXiv 2511.10823, STOC 2026): mixing
      dichotomy, coefficient shifting, compatibility certificates; breaks MITM for most constant
      coefficient sets but is open for {0,1}/Partition. The direct template for C1/C2.
  - name: bsg_energy_and_pfr
    category: additive-combinatorics
    description: >-
      Balog-Szemeredi-Gowers, Shao and Shkredov higher-order energy, and the Gowers-Green-Manners-Tao
      Polynomial Freiman-Ruzsa theorem with its algorithmic version (arXiv 2509.02338). Turns high
      additive energy into large structured subsets; mostly over F_2^n so transfer to Z must be checked.
  - name: plunnecke_ksubset_sumsets
    category: additive-combinatorics
    description: >-
      Plunnecke-Ruzsa inequalities, Dias da Silva-Hamidoune k-subset sum lower bounds
      (|Sigma_k(S)| >= k(m-k)+1), Gyarmati-Matolcsi-Ruzsa submultiplicativity. Lower bounds on
      D* for subset-size-k sumsets; mostly fixed k, we need k = Theta(n).
  - name: dissociated_sidon_structure
    category: additive-combinatorics
    description: >-
      Dissociated and Sidon sets, Sarkozy / Szemeredi-Vu / Lev structure of subset sums, and
      constructive long arithmetic progressions in subset sums (arXiv 2503.19299). Gives the shape
      of sets with many/few subset sums; companion to the forced-relation lemma.
  - name: distinct_subset_sums_extremal
    category: additive-combinatorics-extremal
    description: >-
      Erdos distinct-subset-sums problem, Dubroff-Fox-Xu bound and its 2026 bandwidth refinement
      (arXiv 2609.27941), inverse theorems for sets with few subset sums (arXiv 2605.05498,
      2609.00044), AP-free and density-realization constructions (arXiv 2606.24139, 2609.14630).
      The closest quantitative objects to C2; also candidate hard instances.
  - name: inverse_littlewood_offord
    category: anti-concentration
    description: >-
      Inverse Littlewood-Offord theory (Nguyen-Vu, Tao-Vu, Rudelson-Vershynin) and quantitative
      versions (Kwan-Sauermann, Fox-Kwan-Sauermann): large bins or concentrated subset sums force
      GAP / dissociated structure. Recall-based; matches the AKKN large-bin regime.
  - name: fourier_large_spectrum_bohr
    category: analytic-additive-combinatorics
    description: >-
      Fourier large-spectrum, Chang's lemma and Bohr-set methods; L^4 / L^k Fourier mass of the
      {0,1} subset-sum distribution bounds collisions; see also arXiv 2609.26619 on sets with small
      Fourier L1 norm. Recall-based for the method, searched for the 2026 paper.
  - name: lattice_relation_detection
    category: lattice
    description: >-
      LLL / BKZ relation-lattice detection and low-density attacks (Lagarias-Odlyzko, Coster et al.),
      deterministic hidden-subset-sum algorithms (arXiv 2412.04967). Could expose low-rank GAP
      structure of the support and the relation lattice.
  - name: wagner_kxor_dissection
    category: collision-counting
    description: >-
      Wagner generalized birthday (k-XOR/k-SUM), Schroeppel-Shamir dissection, and counting of equal-sum
      subset pairs; the algorithmic cost model for finding the relations that C1 counts.
  - name: ov_and_space_improvements
    category: algorithmic-family
    description: >-
      Nederlof-Wegrzycki orthogonal-vectors reduction (O*(2^{0.5n}) time, 2^{0.249999n} space) and
      Belova et al. (ESA 2024, 2^{0.246n} space); the matching/disjointness step used by the pipeline.
  - name: cjrs_poly_saving
    category: algorithmic-family
    description: >-
      Chen-Jin-Randolph-Servedio (arXiv 2301.07134): 2^{n/2}/poly(n); the only worst-case saving
      known and the baseline any new structural dichotomy must beat.
  - name: equal_subset_sum_pigeonhole
    category: collision-to-structure
    description: >-
      Pigeonhole Equal-Subset-Sum (PESS): Jin-Williams-Zhang (ESA 2025) 2^{n/3}, improving Jin-Wu 2^{0.4n}.
      Corrected after deep research: arXiv 2607.09289 (Yamano-Shibuya, 1.6994^n) and 2608.08260
      (Ye, (5/3)^n one-sided Monte Carlo) are plain Equal-Subset-Sum, not PESS. PESS is the only
      setting where pigeonhole collisions are turned into a 2^{n/3} algorithm.
  - name: dense_multidimensional_subset_sum
    category: additive-combinatorics-algorithmic
    description: >-
      Chen-Hu-Mao-Zhang (arXiv 2607.10343): structure of subset sums of n >> sqrt(Phi) vectors in a
      box in constant dimension d; lattice/Kneser machinery. Constant d only.
  - name: pseudopolynomial_modular_structure
    category: structure-pseudopoly
    description: >-
      Modular and pseudopolynomial structure results: deterministic linear-time modular subset sum
      (arXiv 2609.30992), Bringmann-Wellnitz dense subset sum, Bringmann-Fischer-Nakos output-sensitive
      algorithms, Chan's deterministic O~(t) (arXiv 2601.01390). The dense end of the dichotomy.
  - name: conditional_lower_bounds
    category: fine-grained
    description: >-
      SETH, k-SUM and lattice-hardness reductions (Abboud-Bringmann-Hermelin-Shabtay; Jin-Williams-Zhang
      tie PESS to lattices). What a proof of C1/C2 would imply, or what would refute them.
  - name: representation_baselines_and_quantum
    category: average-case-technique
    description: >-
      HGJ 0.337, BCJ 0.291, Bonnetain-Bricout-Schrottenloher-Shen 0.283 and quantum analogues.
      Corrected after deep research: arXiv 2608.07309 (Chukhin-Kulikov-Levitskii-Mihajlin) is worst-case
      quantum k-SUM / subset sum in 2^{2n/7}; it only cites the BBSS 0.283 figure.
  - name: average_case_collision_templates
    category: average-case-technique
    description: >-
      Random vector subset sum over F_3^n and binary-error LWE (arXiv 2609.40321, Kothari-Metger-
      O'Donnell-Shutty-Wu). Corrected after deep research: the method is algebraic (degree of
      regularity, Kruskal-Katona, XL), not collision counting; weak relevance to N_c, average case only.
  - name: salas_controlled_aliasing_caution
    category: caution
    description: >-
      arXiv 2503.20162 claims 2^{n/2-eps} via controlled aliasing; our NEXT.md shows a concrete
      counterexample (aliasing merges subsets with different true sums). Included only to verify the
      flaw and to record what a sound adaptive solver would need.

execution:
  batch_size: 4
  items_per_agent: 5
  output_dir: ./results
