[project]
name = "subset-sum-research"
version = "0.1.0"
description = "Exact subset sum research: dependency-free implementations, Lean-checked correctness, reproducible measurements"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "pre-commit>=4.0",
    "pytest>=8",
    "pyyaml>=6.0",
    "ruff==0.15.15",
]

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# scripts/*.py run standalone (not `python -m`), so they patch sys.path with the
# repo root before their src.* imports resolve.
"scripts/**/*.py" = ["E402"]
